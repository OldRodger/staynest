services:
  mongodb:
    image: mongo
    restart: always
    ports:
      - "27016:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  backend:
    depends_on:
      - mongodb
    build: .
    image: stay_nest
    ports:
      - "80:80"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ./.env
volumes:
  mongo_data:

